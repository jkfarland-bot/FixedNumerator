version: "v0.4"

project:
  name: "FixedNumerator: the local step in extending a theorem on quartic Gauss sums over primes to a fixed numerator"
  description: >-
    Theorem 1.1 of C. David, A. Dunn, A. Hamieh and H. Lin (arXiv:2306.11875) bounds the sums of
    normalized quartic Gauss sums g(c) over primary primes c of Z[i] in a class modulo 4, twisted
    by (c/|c|)^l. The companion note extends it to g(nu, c) with any fixed numerator nu. The only
    new ingredient is a local identity that splits off the primes dividing nu from the
    coprimality conditions of the Type I Dirichlet series. This development formalizes that
    step from the identities of DDHL Section 3, taken as hypotheses on an abstract symbol and Gauss
    sum: the splitting identity g(mu, pi^k c') = (-1)^C(c', pi^k) g(mu, pi^k) g(mu pi^(2k), c')
    with no condition linking mu and pi, and DDHL (3.6). It proves the identity for the truncated
    series as an exact finite identity (Lemma 2.2), and gives the four cases of removing pi from
    the coprimality condition (Corollary 2.3): single equations with an explicit finite inverse
    for ord_pi(mu) = 1, 3 (mod 4), and the coupled pair of DDHL (8.6)-(8.7) for 0, 2. It also
    proves lower bounds for the determinants on Re s >= 1, the 2-adic facts behind the signs, and
    the removal of the smoothing (Corollary 1.2): smoothed o(X) bounds and the prime ideal theorem
    give o(X) for the sharp sums.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11L05", "11R18", "11N13", "68V20"]

sources:
  - title: "Quartic Gauss sums over primes with a fixed numerator"
    authors:
      - "Joseph S. Farland"
    type: "article"
    location: "Manuscript, 2026"
    relationship: "formalizes"
    note: >-
      The companion note, by the same author. Lemma 2.2 (with the facts on pi^2 and the signs
      in its proof, and DDHL (3.6)), Corollary 2.3 (all four cases, with the determinant bounds of
      its proof) and Corollary 1.2 are formalized. Lemma 2.1 (the support and sizes from DDHL (3.7)
      enter as hypotheses), Proposition 3.1 (continuation and bounds of the Type I series), the
      iteration over the primes of nu in its Step 2, Section 4 (Vaughan's identity, Type II, the
      contour shift) and Theorem 1.1 itself are not.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Quartic Gauss sums over primes and metaplectic theta functions"
    authors:
      - "Chantal David"
      - "Alexander Dunn"
      - "Alia Hamieh"
      - "Hua Lin"
    type: "article"
    location: "arXiv:2306.11875v5, 2026; to appear in Algebra & Number Theory"
    relationship: "background"
    note: >-
      The identities (3.2), (3.4), (3.5) and the support part of (3.7) are the hypotheses packaged
      in QuarticData; (3.6), (8.6) and (8.7) are recovered; Theorem 1.1 is the result extended.
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Formalized: primary Gaussian integers, pi^2 = 1 (mod 4) for primary pi, the invariance of the
    reciprocity sign under the class modulo 4 and its value 1 at even powers; DDHL (3.6) from
    (3.2), (3.4), (3.5); the splitting identity and periodicity of the numerator modulo fourth
    powers; the splitting identity for truncated sums over Gaussian integers of norm at most X in
    a class modulo 4 prime to gamma, with a completely multiplicative weight; its two-term form;
    the single equations for ord_pi(mu) in {1, 3} and their finite inverse; the coupled pair for
    ord_pi(mu) in {0, 2}; lower bounds for 1 + a w^k, 1 + a w^2, 1 + a w^4 and 1 - a1 a3 w^4 on
    sigma >= 1; and the passage from smoothed o(X) bounds to the sharp sum. Not formalized: that
    the quartic residue symbol and Gauss sum satisfy the hypotheses (DDHL Section 3), the sizes in
    (3.7)-(3.9), the passage from truncated sums to Dirichlet series, the iteration over several
    primes, the meromorphic continuation and convexity bounds (DDHL Proposition 4.3), Suzuki's
    relation (4.39), Vaughan's identity, the quadratic large sieve, the contour shift, the
    covering of [delta, 1] by intervals [y, 2y], and Theorem 1.1 itself.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the note's
        statements and proofs and compiled locally with lake; the formulation with an abstract
        symbol and Gauss sum and with truncated sums in place of Dirichlet series was proposed by
        Claude and adopted by the author.
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was given the note and asked to formalize the step that is not in DDHL, without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope: the new local step, the bookkeeping that depends on it, and the
    removal of the smoothing, with the analytic inputs of DDHL left as cited results.

fidelity:
  divergences: >-
    The quartic residue symbol and Gauss sum are abstract functions chi and g on the Gaussian
    integers, packaged with the identities of DDHL Section 3 that the computation uses; the
    multiplicativity of the symbol in the denominator is assumed for primary denominators, and
    biquadratic reciprocity for coprime primary pairs, including units. Numerators lie in Z[i]
    rather than lambda^(-2) Z[i]; this covers -i b^3 and -8i b^3 = lambda^6 b^3. The series
    psi*_beta(s, mu, l; gamma) of DDHL (8.1) is replaced by its truncation at norm X with an
    arbitrary completely multiplicative weight W, W(1) = 1, standing for (c/|c|)^l N(c)^(-s);
    the identities are exact finite identities, and the inverse of Delta(s) appears as a finite
    alternating sum. The determinant bounds are stated for a complex number w of modulus
    N^(-sigma), standing for W(pi). In Corollary 1.2 the sums are indexed by the norm, the
    smoothed bound is assumed as o(X) for every smooth R supported in some [delta, 1], and the
    prime ideal theorem enters as the hypothesis that sum_{n <= x} |a n| / x tends to a limit.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The definitions in Challenge.lean are copied verbatim from the development and compared by
    Comparator, including the structure QuarticData (a modified copy is rejected). The companion
    note was read against DDHL by an independent AI referee pass; no external human referee has
    reviewed the note or the formalization.

